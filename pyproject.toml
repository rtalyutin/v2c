[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "v2c"
version = "0.1.0"
description = "Project-specific AI transformation and verifiable maintenance handover"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.146,<1", "pydantic>=2.14,<3", "SQLAlchemy>=2.1,<3",
  "alembic>=1.20,<2", "httpx>=0.28,<1", "boto3>=1.43,<2",
  "uvicorn>=0.54,<1", "psycopg[binary]>=3.3,<4",
  "python-multipart>=0.0.32,<1", "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]
dev = ["ruff==0.17.3", "mypy==2.4.0", "uv==0.13.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
v2c = ["web/*", "web/modules/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
incremental = false
follow_imports = "silent"
strict = true
files = [
  "src/v2c/diagnostics.py", "src/v2c/engine.py", "src/v2c/db.py", "src/v2c/worker.py",
  "src/v2c/pipeline.py", "src/v2c/config.py", "src/v2c/contracts", "src/v2c/application",
  "src/v2c/adapters/runner.py",
  "src/v2c/workflow", "src/v2c/persistence", "src/v2c/orchestration",
  "src/v2c/runner", "src/v2c/providers", "src/v2c/runner_service.py",
  "src/v2c/timeweb_gateway.py", "scripts/export_openapi.py",
]
# Retained legacy files outside strict checking: api.py (transport glue),
# adapters/model.py (model wire client), intake.py, delivery.py, storage.py,
# model_probe.py and models.py.
# Their imported types remain visible through follow_imports=silent. Expand
# this list's coverage when touching their interfaces; new extracted owners
# are all included above. Tests/deploy scripts are linted and executed, not
# accepted as statically typed application interfaces.

