[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "v2c"
version = "0.1.0"
description = "Project-specific AI transformation and verifiable maintenance handover"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.146,<1", "pydantic>=2.14,<3", "SQLAlchemy>=2.1,<3",
  "alembic>=1.20,<2", "httpx>=0.28,<1", "boto3>=1.43,<2",
  "uvicorn>=0.54,<1", "psycopg[binary]>=3.3,<4",
  "python-multipart>=0.0.32,<1", "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
v2c = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

