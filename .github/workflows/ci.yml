name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maintainer checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: v2c
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: v2c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2c -d v2c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      V2C_DATABASE_URL: postgresql+psycopg://v2c:test-only-password@localhost:5432/v2c
      V2C_TEST_POSTGRES_URL: postgresql+psycopg://v2c:test-only-password@localhost:5432/v2c
      V2C_API_TOKEN: ci-only-token-for-disposable-database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
          npm ci
          npx playwright install --with-deps chromium
      - name: Check dependency locks
        run: python scripts/lock.py --check
      - name: Migrate clean PostgreSQL
        run: alembic upgrade head
      - name: Check source, contracts, migrations, tests and browser
        run: python scripts/check.py --integration --web
      - name: Check container configuration
        env:
          V2C_POSTGRES_PASSWORD: test-only-password
          V2C_MINIO_ROOT_USER: test-only-admin
          V2C_MINIO_ROOT_PASSWORD: test-only-minio-password
        run: docker compose config --quiet
      - name: Build control image
        run: docker build --tag v2c:ci .
